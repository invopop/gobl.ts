name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Release numbering is derived, so the derivation is tested.
      - name: Version derivation
        run: .github/scripts/next-version.test.sh .github/scripts/next-version.sh

      - name: Go generator is formatted and vets clean
        run: |
          test -z "$(gofmt -l cmd/)" || { gofmt -d cmd/; exit 1; }
          go vet ./...

      # The generated tree is committed, so a stale checkout must fail the
      # build rather than silently shipping types from an older GOBL.
      - name: Generated types are up to date
        run: |
          go run ./cmd/generate
          git diff --exit-code src/gen

      # The generator emits already-formatted TypeScript so that generation
      # needs no node toolchain. This is the guard that the reproduction of
      # prettier's output stays faithful.
      - run: npx prettier --check .

      # Type-level assertions (the 133-envelope corpus check and the
      # `@ts-expect-error` cases) are compile-time only, so tsc is what runs
      # them; vitest covers the runtime tests.
      # The package major.minor must track the GOBL release the types came
      # from; checked rather than merely documented.
      - run: npm run check-version

      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      # Guards the published package shape: subpath entries, dual ESM/CJS, and
      # that the bulky extension labels stay out of the root import.
      - run: npx vitest run test/package.test.ts

      # Packs the tarball and consumes it from a throwaway project, in both
      # ESM and CommonJS. In-repo type checking cannot see declaration-emit
      # bugs, so this is the only step that exercises the published .d.ts.
      - run: npm run verify-package

  live:
    runs-on: ubuntu-latest
    # The public API is a moving target, so a failure here should not block a
    # pull request; it tells us when GOBL's behaviour has changed under us.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: GOBL_LIVE=1 npx vitest run test/live.test.ts
